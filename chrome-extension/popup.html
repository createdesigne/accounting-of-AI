<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>思考レシート</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        color: #1e293b;
        background: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.4;
      }

      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        color: #ffffff;
        background: #2563eb;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      label { display: grid; gap: 6px; margin: 12px 0; font-size: 13px; }
      select { width: 100%; min-height: 44px; border: 1px solid #cbd5e1; border-radius: 10px; padding: 8px; background: white; color: #1e293b; font: inherit; }
      button:focus-visible, select:focus-visible { outline: 3px solid #0ea5e9; outline-offset: 2px; }

      p {
        margin: 10px 0 0;
        color: #475569;
        font-size: 12px;
        line-height: 1.6;
      }

      .tracking {
        margin: 16px 0;
        padding-top: 14px;
        border-top: 1px solid #cbd5e1;
      }

      .tracking h2 { margin: 0; font-size: 14px; }
      .tracking-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .tracking-actions button { min-height: 40px; }
      #trackingStop { color: #334155; background: #e2e8f0; }
      #timeLedgerTransfer { margin-top: 10px; background: #047857; }
    </style>
  </head>
  <body>
    <h1>AI会話を思考レシートへ</h1>
    <p>ChatGPT・Claude・Geminiの会話に対応。会話と回答を表示し、生成が終わってから実行してください。読み込まれた本文の直近20メッセージを取り込みます。</p>
    <label>送信先<select id="destination"><option value="production">本番サイト</option><option value="preview">確認用プレビュー</option><option value="local">ローカル開発用</option></select></label>
    <button id="createReceipt" type="button">思考レシート化する</button>
    <p id="status" role="status" aria-live="polite">ボタンを押すと、現在のAI会話を選択したWebアプリへ渡します。内容を確認してから帳簿に保存できます。</p>
    <section class="tracking" aria-labelledby="trackingHeading">
      <h2 id="trackingHeading">ChatGPT利用時間</h2>
      <p>開始を押した後、ChatGPTを操作している時間だけ端末内に記録します。会話本文や入力内容は取得・送信しません。</p>
      <div class="tracking-actions">
        <button id="trackingStart" type="button">計測を開始</button>
        <button id="trackingStop" type="button">計測を停止</button>
      </div>
      <p id="trackingStatus" role="status" aria-live="polite">計測状態を確認しています…</p>
      <button id="timeLedgerTransfer" type="button">帳簿へ連携</button>
      <p id="timeTransferStatus" role="status" aria-live="polite">確定済みの利用時間だけを選択した送信先へ渡します。この操作だけでは帳簿へ保存されません。</p>
    </section>
    <p id="version" aria-label="拡張機能のバージョン"></p>
    <script src="timeRecordProtocol.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
